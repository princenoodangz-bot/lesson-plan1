<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf5e8">
<title>ระบบสร้างแผนการสอน</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=40">
</head>
<body>

<section id="auth" class="auth hidden">
  <form id="authForm" class="card auth-card">
    <h1>ระบบสร้างแผนการสอน</h1>
    <p class="muted">เข้าสู่ระบบเพื่อเริ่มต้น</p>
    <label>อีเมล<input type="email" id="authEmail" required autocomplete="email"></label>
    <label>รหัสผ่าน<input type="password" id="authPass" required minlength="6" autocomplete="current-password"></label>
    <div class="row">
      <button type="submit" class="btn primary" data-mode="in">เข้าสู่ระบบ</button>
      <button type="button" class="btn" id="signupBtn">สมัครบัญชีใหม่</button>
    </div>
    <button type="button" class="btn" id="googleBtn" style="width:100%;margin-top:8px">เข้าสู่ระบบด้วย Google</button>
    <p id="authMsg" class="muted"></p>
    <p><a href="?demo=1" class="btn">👀 ดูตัวอย่างโดยไม่ล็อกอิน</a></p>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><span class="dot"></span> ระบบสร้างแผนการสอน</div>
    <div class="crumb" id="crumb"></div>
    <div class="quota" id="quota" data-tab-link="t7"></div>
    <button class="btn small ghost" id="logoutBtn">ออกจากระบบ</button>
  </header>

  <nav class="steps" id="steps">
    <button data-tab="t1" class="step"><b>0</b><span>โครงสร้างหลักสูตร</span></button>
    <button data-tab="t0" class="step"><b>1</b><span>เล่มหลักสูตร</span></button>
    <button data-tab="t9" class="step"><b>2</b><span>หลักสูตร/กำหนดการ</span></button>
    <button data-tab="t2" class="step"><b>3</b><span>โครงสร้างรายวิชา</span></button>
    <button data-tab="t3" class="step"><b>4</b><span>หน่วยการเรียนรู้</span></button>
    <button data-tab="t4" class="step"><b>5</b><span>หัวข้อแผน</span></button>
    <button data-tab="t5" class="step"><b>6</b><span>เขียนแผนรายคาบ</span></button>
    <button data-tab="t6" class="step"><b>7</b><span>พรีวิวแผน</span></button>
    <button data-tab="t10" class="step"><b>8</b><span>ตรวจตัวชี้วัด</span></button>
    <button data-tab="t8" class="step"><b>9</b><span>ดาวน์โหลด</span></button>
    <button data-tab="t7" class="step gear"><b>10</b><span>⚙ ตั้งค่า</span></button>
  </nav>

  <main>
    <section id="t0" class="tab"></section>
    <section id="t1" class="tab"></section>
    <section id="t2" class="tab"></section>
    <section id="t3" class="tab"></section>
    <section id="t4" class="tab"></section>
    <section id="t5" class="tab"></section>
    <section id="t6" class="tab"></section>
    <section id="t7" class="tab"></section>
    <section id="t9" class="tab"></section>
    <section id="t8" class="tab"></section>
    <section id="t10" class="tab"></section>
  </main>
</div>

<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast" class="toast hidden"></div>

<script>try{navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));caches.keys().then(k=>k.forEach(c=>caches.delete(c)))}catch(e){}</script>
<script src="assets/config.js"></script>
<script type="module" src="assets/app.js?v=40"></script>
</body>
</html>
